name: "Static Analysis"

on: [push]

jobs:
  static-analysis:
    permissions:
      contents: read
      security-events: write
    uses: netsurf-browser/ci-tools/.github/workflows/static-analysis.yaml@master
    with:
      # For the SDL, VNC and Wayland surfaces.
      extra-packages: libsdl1.2-dev libvncserver-dev libwayland-dev
